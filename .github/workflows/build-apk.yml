name: Build VakDab Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build VakDab APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK file
        run: |
          mkdir -p apk-output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} apk-output/VakDab-Android-TV.apk \;

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VakDab-Android-TV-APK
          path: apk-output/VakDab-Android-TV.apk
          if-no-files-found: error
          retention-days: 60
