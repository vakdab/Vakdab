        function lpFmtTime(sec) {

                wrap.appendChild(openingSkip);

                // Click on wrap — toggle play, show controls
                wrap.addEventListener('click', e => {
                    if (e.target.closest('.lp-controls, .lp-quality-rail, .video-overlay-topbar, .player-preview-play')) return;
                    this._flashCenter();
                    this.togglePlay();
                    this._showControls();
                });
                wrap.addEventListener('dblclick', e => {
                    if (e.target.closest('.lp-controls, .lp-quality-rail, .video-overlay-topbar, .player-preview-play')) return;
                    this.toggleFullscreen();
                });
                wrap.addEventListener('mousemove', () => this._showControls());
                wrap.addEventListener('pointerdown', () => this._showControls(), { passive: true });
                wrap.addEventListener('touchstart', () => this._showControls(), { passive: true });
                wrap.addEventListener('touchend', () => this._showControls(), { passive: true });

                // Play button
                const playBtn = wrap.querySelector('#lpPlayBtn');
                if (playBtn) playBtn.addEventListener('click', e => { e.stopPropagation(); this._flashCenter(); this.togglePlay(); });

                // Progress bar seek
                const progress = wrap.querySelector('#lpProgress');
                if (progress) {
                    const seek = e => {
                        const rect = progress.getBoundingClientRect();
                        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                        if (v.duration) v.currentTime = pct * v.duration;
                    };
                    let dragging = false;
                    progress.addEventListener('mousedown', e => { dragging = true; seek(e); e.preventDefault(); });
                    document.addEventListener('mousemove', e => { if (dragging) seek(e); });
                    document.addEventListener('mouseup', () => { dragging = false; });
                    progress.addEventListener('touchstart', e => { seek(e.touches[0]); }, { passive: true });
                    progress.addEventListener('touchmove', e => { seek(e.touches[0]); }, { passive: true });
                }

                // Volume — mute toggle plus a compact range slider.
                const volBtn = wrap.querySelector('#lpVolBtn');
                const volumeSlider = wrap.querySelector('#lpVolume');
                v.volume = this.state.volume ?? 0.8;
                if (volBtn) volBtn.addEventListener('click', e => {

                    e.stopPropagation();

                    v.muted = value === 0;
                    this.state.volume = value;
                    this.state.muted = v.muted;
                    this._updateVolBtn();
                });
                v.addEventListener('volumechange', () => this._updateVolBtn());
                const skipBy = seconds => {
                    if (!Number.isFinite(v.duration)) return;
                    v.currentTime = Math.max(0, Math.min(v.duration, v.currentTime + seconds));
                    this._showControls();
                };
                const skipBackBtn = wrap.querySelector('#lpSkipBackBtn');
                const skipForwardBtn = wrap.querySelector('#lpSkipForwardBtn');
                skipBackBtn?.addEventListener('click', e => { e.stopPropagation(); skipBy(-10); });
                skipForwardBtn?.addEventListener('click', e => { e.stopPropagation(); skipBy(10); });

                // Quality menu support remains available for HLS sources.
                const qualityBtn = wrap.querySelector('#lpQualityBtn');
                const qualityMenu = wrap.querySelector('#lpQualityMenu');
                const qualityLabel = wrap.querySelector('#lpQualityLabel');
                const qualityRail = this._qualityRail;
                const setMenuOpen = (menu, btn, open) => {
                    if (!menu || !btn) return;
                    menu.classList.toggle('is-open', open);

                    btn.setAttribute('aria-expanded', String(open));

                };

                const closePlayerMenus = () => setMenuOpen(qualityMenu, qualityBtn, false);
                if (qualityBtn && qualityMenu) qualityBtn.addEventListener('click', e => {
                    e.stopPropagation();
                    const willOpen = !isMenuOpen(qualityMenu);
                    this._refreshQualityMenu();
                    setMenuOpen(qualityMenu, qualityBtn, willOpen);
                });
                const applyQuality = option => {
                    if (!option) return;
                    const idx = Number(option.dataset.qualityIndex);
                    if (this.hls) this.hls.currentLevel = idx;
                    const label = option.dataset.qualityLabel || 'Авто';
                    if (qualityLabel) qualityLabel.textContent = label;
                    qualityMenu?.querySelectorAll('[data-quality-index]').forEach(item => {
                        const active = item === option || Number(item.dataset.qualityIndex) === idx;
                        item.classList.toggle('is-active', active);
                        item.setAttribute('aria-checked', String(active));
                    });
                    qualityRail?.querySelectorAll('[data-quality-index]').forEach(item => {
                        const active = item === option || (idx >= 0 && Number(item.dataset.qualityIndex) === idx);
                        item.classList.toggle('is-active', active);
                        item.setAttribute('aria-checked', String(active));
                    });
                    closePlayerMenus();
                };
                qualityMenu?.addEventListener('click', e => {
                    const option = e.target.closest('[data-quality-index]');
                    if (!option) return;
                    e.stopPropagation();
                    applyQuality(option);
                });
                qualityRail?.addEventListener('click', e => {
                    const option = e.target.closest('[data-quality-index]');
                    if (!option) return;
                    e.stopPropagation();
                    applyQuality(option);
                });

                this._closePlayerMenus = closePlayerMenus;
                this._refreshQualityMenu();

                // Fullscreen — single button lives in the video topbar (works for both
                // the custom player and iframe-based sources).

                this._onFullscreenChange = () => {
                    this.state.fullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
                    const fullscreenButtons = [
                        document.getElementById('playerFullscreenBtn'),
                        this.containerRef?.querySelector('#lpFullscreenBtn')
                    ].filter(Boolean);
                    fullscreenButtons.forEach(button => {
                        button.innerHTML = this.state.fullscreen ? LP_ICONS.fsExit : LP_ICONS.fsEnter;
                        button.title = this.state.fullscreen ? 'Вийти з повного екрана' : 'Повний екран';

                document.addEventListener('webkitfullscreenchange', this._onFullscreenChange);

                // Keyboard
                this._onKeyDown = e => {
                    const modal = document.getElementById('playerPageModal');
                    if (!modal || modal.style.display === 'none' || modal.style.display === '') return;
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                    if (e.code === 'Space') { e.preventDefault(); this._flashCenter(); this.togglePlay(); this._showControls(); }

                    else if (e.code === 'KeyF') { e.preventDefault(); this.toggleFullscreen(); }

                document.addEventListener('keydown', this._onKeyDown);
            }

            _select1080Quality() {
                if (!this.hls?.levels?.length) return;
                const levels = this.hls.levels;
                const exact = levels.findIndex(level => Number(level.height) === 1080);
                const underOrEqual = levels
                    .map((level, index) => ({ index, height: Number(level.height) || 0 }))
                    .filter(level => level.height > 0 && level.height <= 1080)
                    .sort((a, b) => b.height - a.height);
                const fallback = underOrEqual[0]?.index ?? levels
                    .map((level, index) => ({ index, height: Number(level.height) || 0 }))
                    .sort((a, b) => b.height - a.height)[0]?.index;
                const selected = exact >= 0 ? exact : fallback;
                if (Number.isInteger(selected)) this.hls.currentLevel = selected;
            }

            _refreshQualityMenu(autoSelectMax = false) {
                const menu = this.containerRef?.querySelector('#lpQualityMenu');
                const labelEl = this.containerRef?.querySelector('#lpQualityLabel');
                if (!menu) return;
                const checkSvg = '<svg class="lp-check" viewBox="0 0 24 24" width="14" height="14"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
                const mkBtn = (idx, label, active) => `<button type="button" class="${active ? 'is-active' : ''}" data-quality-index="${idx}" data-quality-label="${label}" role="menuitemradio" aria-checked="${active}"><span>${label}</span>${checkSvg}</button>`;
                const rail = this._qualityRail;
                const levels = this.hls?.levels || [];
                if (!levels.length) {
                    menu.innerHTML = '<div class="lp-popover-label">Якість</div>' + mkBtn(-1, 'Авто', true);
                    if (rail) { rail.innerHTML = ''; rail.hidden = true; }
                    if (labelEl) labelEl.textContent = 'Авто';
                    return;
                }
                const unique = [];
                levels.forEach((level, index) => {
                    const label = level.height ? `${level.height}p` : `Рівень ${index + 1}`;
                    if (!unique.some(item => item.label === label)) {
                        unique.push({ label, index, height: level.height || 0, bitrate: level.bitrate || 0 });
                    }
                });
                unique.sort((a, b) => (b.height || 0) - (a.height || 0) || (b.bitrate || 0) - (a.bitrate || 0));

                let currentIdx = this.hls ? this.hls.currentLevel : -1;
                // Auto-select max quality on stream load
                if (autoSelectMax && unique.length > 0 && this.hls) {
                    const maxLevel = unique[0];
                    currentIdx = maxLevel.index;
                    this.hls.currentLevel = currentIdx;
                }

                const activeItem = unique.find(item => item.index === currentIdx);
                const activeLabel = activeItem ? activeItem.label : (currentIdx === -1 ? 'Авто' : 'Макс');
                if (labelEl) labelEl.textContent = activeLabel;

                menu.innerHTML = '<div class="lp-popover-label">Якість</div>' +
                    mkBtn(-1, 'Авто', currentIdx === -1) +
                    unique.map(item => mkBtn(item.index, item.label, item.index === currentIdx)).join('');
                if (rail) {
                    rail.innerHTML = unique.map(item => mkBtn(item.index, item.label, item.index === currentIdx)).join('');
                    rail.hidden = false;
                }
            }

            setQuality(qualityString) {
                if (!this.hls || !this.hls.levels?.length) return;
                const levels = this.hls.levels;
                const qStr = String(qualityString || '').toLowerCase().trim();
                if (qStr.includes('авто') || qStr.includes('auto')) {
                    this.hls.currentLevel = -1;
                    this._refreshQualityMenu(false);
                    return;
                }
                if (qStr.includes('макс') || qStr.includes('max')) {
                    this._refreshQualityMenu(true);
                    return;
                }
                const matchNum = parseInt(qStr);
                if (Number.isFinite(matchNum)) {
                    const found = levels.findIndex(lvl => lvl.height === matchNum);
                    if (found >= 0) {
                        this.hls.currentLevel = found;
                        this._refreshQualityMenu(false);
                        return;
                    }
                }
                this._refreshQualityMenu(true);
            }

            _updatePlayBtn() {
                const btn = this.containerRef?.querySelector('#lpPlayBtn');
                if (btn) {
                    btn.innerHTML = this.state.playing ? LP_ICONS.pause : LP_ICONS.play;
                    btn.title = this.state.playing ? 'Пауза' : 'Відтворити';
                    btn.setAttribute('aria-label', this.state.playing ? 'Пауза' : 'Відтворити');
                }
            }

            _updateVolBtn() {
                const btn = this.containerRef?.querySelector('#lpVolBtn');
                const slider = this.containerRef?.querySelector('#lpVolume');
                const v = this.videoRef;
                const isMuted = !!(v && (v.muted || v.volume === 0));
                if (btn) {
                    btn.innerHTML = isMuted ? LP_ICONS.volOff : LP_ICONS.volOn;
                    btn.title = isMuted ? 'Увімкнути звук' : 'Вимкнути звук';
                    btn.setAttribute('aria-label', btn.title);
                }
                if (slider && v) {
                    slider.value = String(v.volume ?? 0);
                    slider.setAttribute('aria-valuenow', String(Math.round((v.volume ?? 0) * 100)));
                }
            }

            _updateProgress() {
                const fill = this.containerRef?.querySelector('#lpProgressFill');
                const time = this.containerRef?.querySelector('#lpTime');
                const v = this.videoRef;
                if (fill && v && v.duration) {
                    fill.style.width = (v.currentTime / v.duration * 100) + '%';
                }
                if (time && v) {
                    time.textContent = lpFmtTime(v.currentTime) + ' / ' + lpFmtTime(v.duration);
                }
            }

            _showControls() {
                const c = this._controls;
                if (!c) return;
                c.classList.remove('hidden');
                this.containerRef?.classList.remove('controls-hidden');
                clearTimeout(this._controlsTimer);
                if (this.state.playing) {
                    this._controlsTimer = setTimeout(() => {
                        c.classList.add('hidden');
                        this.containerRef?.classList.add('controls-hidden');
                    }, 3200);
                }
            }

            _flashCenter() {
                const btn = this._centerBtn;
                if (!btn) return;
                btn.innerHTML = this.state.playing ? LP_ICONS.pause : LP_ICONS.play;
                btn.classList.add('show');
                clearTimeout(this._centerTimer);
                this._centerTimer = setTimeout(() => btn.classList.remove('show'), 600);
            }

            loadSource(src, animeTitle, episodeTitle) {
                const requestId = ++this._sourceRequestId;
                this._lastSourceRequest = { src, animeTitle, episodeTitle };
                if (isEmbedUrl(src)) {
                    this.container.innerHTML = '';
                    const iframe = document.createElement('iframe');
                    iframe.src = src;
                    iframe.setAttribute('allowfullscreen', '');
                    iframe.setAttribute('allow', 'autoplay; fullscreen');
                    iframe.style.cssText = 'width:100%;height:100%;border:none;position:absolute;top:0;left:0;';
                    const wrap = document.createElement('div');
                    wrap.className = 'lampa-player-container';
                    wrap.style.cssText = 'width:100%;aspect-ratio:16/9;background:#000;position:relative;border-radius:12px;overflow:hidden;';
                    wrap.appendChild(iframe);
                    wrap.classList.add('is-loading');
                    this.container.appendChild(wrap);
                    this.containerRef = wrap;
                    if (this.hls) { this.hls.destroy(); this.hls = null; }
                    this.videoRef = null;
                    this.state.loading = false;
                    window.setTimeout(() => { if (requestId === this._sourceRequestId) wrap.classList.remove('is-loading'); }, 120);
                    return;
                }

                if (!this.videoRef) this._init();
                // Mobile Safari/iOS needs an explicit inline media mode and a mobile UA at the source proxy.
                const media = this.videoRef;

                    media.setAttribute('playsinline', '');
                    media.setAttribute('webkit-playsinline', '');
                    media.preload = 'metadata';
                }
                // Ensure https
                if (src && src.startsWith('http://')) src = 'https://' + src.slice(7);
                this.state.src = src;
                this._clearPlaybackError();
                const v = this.videoRef;
                this.state.loading = true;
                this.state.playing = false;
                this._spinner.classList.remove('hidden');
                this._updatePlayBtn();

                if (this.hls) { this.hls.destroy(); this.hls = null; }
                v.pause();
                if (!src) { this.state.loading = false; return; }

                const isMobileDevice = typeof navigator !== 'undefined' && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
                const proxyUrl = (typeof getProxyUrl === 'function' && !src.startsWith(PROXY_URL))
                    ? getProxyUrl(src, isMobileDevice ? 'mobile' : 'desktop')
                    : src;

                const isCurrentRequest = () => requestId === this._sourceRequestId && this.videoRef === v;
                const hideLoading = () => {
                    if (!isCurrentRequest()) return;
                    this.state.loading = false;
                    this._spinner?.classList.add('hidden');
                    this.containerRef?.classList.remove('is-loading');
                };
                const safePlay = () => {
                    if (!isCurrentRequest()) return;
                    v.play().catch(() => {
                        if (!isCurrentRequest()) return;
                        v.muted = true;
                        this.state.muted = true;
                        this._updateVolBtn();
                        v.play().catch(() => {});
                    });
                };

                const _startHls = () => {
                    const hls = new Hls({
                        enableWorker: false,
                        lowLatencyMode: false,
                        backBufferLength: 90,
                        maxBufferLength: 30,
                        xhrSetup: function(xhr) { xhr.withCredentials = false; }
                    });
                    this.hls = hls;
                    hls.loadSource(proxyUrl);
                    hls.attachMedia(v);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        if (!isCurrentRequest()) return;
                        this._select1080Quality();
                        hideLoading();
                        safePlay();
                    });

                            console.warn('[HLS fatal]', ed.type, ed.details);

                            hls.destroy(); this.hls = null;
                            hideLoading();

                        }
                    });
                    v.addEventListener('error', () => { if (isCurrentRequest()) this._schedulePlaybackError('Потік пошкоджений, заблокований або несумісний із цим пристроєм.'); }, { once: true });
                };

                    // Attach listeners before load(): Safari can emit error synchronously for a bad source.
                    const onNativeError = () => {

                    };

                    v.load();
                    safePlay();
                } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                    _startHls();
                } else if (isSafariNativeHls && (v.canPlayType('application/vnd.apple.mpegurl') !== '' || v.canPlayType('audio/mpegurl') !== '')) {
                    const onNativeError = () => this._schedulePlaybackError('HLS-потік не вдалося відкрити на цьому пристрої.');
                    v.addEventListener('error', onNativeError, { once: true });
                    v.addEventListener('canplay', () => { hideLoading(); safePlay(); }, { once: true });
                    v.src = proxyUrl; v.load();
                    safePlay();
                } else {
                    const sc = document.createElement('script');
                    sc.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js';
                    sc.onload = () => {
                        if (!isCurrentRequest()) return;
                        if (Hls.isSupported()) _startHls();
                        else {
                            v.addEventListener('canplay', () => { hideLoading(); safePlay(); }, { once: true });
                            v.src = proxyUrl; v.load(); hideLoading(); safePlay();
                        }
                    };
                    sc.onerror = () => {
                        if (!isCurrentRequest()) return;
                        v.addEventListener('canplay', () => { hideLoading(); safePlay(); }, { once: true });

                    };
                    document.head.appendChild(sc);
                }
            }

            _clearPlaybackError() {
                clearTimeout(this._playbackErrorTimer);
                this._playbackErrorTimer = null;
                this.containerRef?.querySelector('.lp-error')?.remove();
            }

            _schedulePlaybackError(message, delay = 6000) {
                clearTimeout(this._playbackErrorTimer);
                const requestId = this._sourceRequestId;
                const video = this.videoRef;
                this._playbackErrorTimer = window.setTimeout(() => {
                    this._playbackErrorTimer = null;
                    if (requestId !== this._sourceRequestId || video !== this.videoRef) return;
                    if (video && (video.readyState >= 2 || !video.error)) {
                        this._clearPlaybackError();
                        return;
                    }
                    this._showPlaybackError(message);
                }, delay);
            }

            _showPlaybackError(message) {
                this.state.loading = false;
                this._spinner?.classList.add('hidden');
                if (!this.containerRef || this.containerRef.querySelector('.lp-error')) return;
                const error = document.createElement('div');
                error.className = 'lp-error';
                error.innerHTML = `<strong>Не вдалося запустити відео</strong><span>${message}</span><button type="button" class="lp-error-retry"><i class="fas fa-rotate-right"></i> Спробувати ще раз</button>`;
                error.querySelector('.lp-error-retry')?.addEventListener('click', event => {
                    event.stopPropagation();
                    const last = this._lastSourceRequest;
                    if (last?.src) this.loadSource(last.src, last.animeTitle, last.episodeTitle);
                });
                this.containerRef.appendChild(error);
            }

            togglePlay() {
                if (!this.videoRef) return;
                const v = this.videoRef;
                if (v.paused) v.play().catch(() => {
                            v.muted = true;
                            this.state.muted = true;
                            this._updateVolBtn();
                            v.play().catch(() => {});
                        }); else v.pause();
            }

            toggleFullscreen() {
                const target = (this.containerRef && document.body.contains(this.containerRef))
                    ? this.containerRef : this.container;
                if (!target) return;
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    const request = target.requestFullscreen || target.webkitRequestFullscreen || target.msRequestFullscreen;
                    if (request) Promise.resolve(request.call(target)).catch(() => {});
                    else if (this.videoRef?.webkitEnterFullscreen) this.videoRef.webkitEnterFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            }

            destroy() {
                clearTimeout(this._controlsTimer);
                clearTimeout(this._playbackErrorTimer);
                this._playbackErrorTimer = null;
                this._sourceRequestId += 1;
                if (this._onKeyDown) document.removeEventListener('keydown', this._onKeyDown);
                if (this._onFullscreenChange) {
                    document.removeEventListener('fullscreenchange', this._onFullscreenChange);
                    document.removeEventListener('webkitfullscreenchange', this._onFullscreenChange);
                    this._onFullscreenChange = null;
                }
                if (this._closePlayerMenus) document.removeEventListener('click', this._closePlayerMenus);
                clearTimeout(this._centerTimer);
                if (this.hls) { this.hls.destroy(); this.hls = null; }
                if (this.videoRef) { this.videoRef.pause(); this.videoRef.removeAttribute('src'); this.videoRef.load(); }
                if (this.container) this.container.innerHTML = '';
                this.videoRef = null;
                this.containerRef = null;
                this._controls = null;
                this._spinner = null;
            }
        }

const aniSkipCache=new Map();
async function getAniSkipSegments(malId,episode){const id=Number(malId),ep=Number(episode);if(!Number.isInteger(id)||id<=0||!Number.isInteger(ep)||ep<=0)return[];const key=`${id}:${ep}`;if(aniSkipCache.has(key))return aniSkipCache.get(key);const request=fetch(`https://api.aniskip.com/v1/skip-times/${id}/${ep}?types=op&types=ed`).then(r=>r.ok?r.json():null).then(data=>(data?.found===true?data.results:[])||[]).then(results=>results.map(item=>({start:Number((item.interval||item).start_time),end:Number((item.interval||item).end_time),type:item.skip_type})).filter(x=>Number.isFinite(x.start)&&Number.isFinite(x.end)&&x.end>x.start&&x.type==='op')).catch(()=>[]);aniSkipCache.set(key,request);return request;}
async function attachAniSkip(video,malId,episode){const segments=await getAniSkipSegments(malId,episode);if(!segments.length)return;const button=video.closest('.lampa-player-container')?.querySelector('.lp-opening-skip');if(!button)return;let active=null;const hide=()=>{button.hidden=true;active=null};const onSkip=e=>{e.stopPropagation();if(!active)return;video.currentTime=active.end;hide();showNotice('Opening пропущено')};button.addEventListener('click',onSkip);const update=()=>{const now=Number(video.currentTime);active=segments.find(x=>now>=x.start&&now<x.end)||null;button.hidden=!active};video.addEventListener('timeupdate',update);video.addEventListener('seeking',update);video.addEventListener('emptied',()=>{video.removeEventListener('timeupdate',update);video.removeEventListener('seeking',update);button.removeEventListener('click',onSkip);hide()},{once:true});}
function showNotice(text){const n=document.getElementById('notice');if(!n)return;n.textContent=text;n.classList.add('is-visible');setTimeout(()=>n.classList.remove('is-visible'),2200);}

window.VakdabLampaPlayer=LampaPlayer;const params=new URLSearchParams(location.search);const host=document.getElementById('videoPlayer');const player=new LampaPlayer(host,{poster:params.get('poster')||''});const srcInput=document.getElementById('sourceInput'),titleInput=document.getElementById('titleInput'),malInput=document.getElementById('malInput'),episodeInput=document.getElementById('episodeInput');srcInput.value=params.get('src')||'';titleInput.value=params.get('title')||'';malInput.value=params.get('malId')||'';episodeInput.value=params.get('episode')||'1';function loadVideo(){const src=srcInput.value.trim();if(!src)return showNotice('Вкажіть URL відео');const title=titleInput.value.trim()||'VakDab Player';player.loadSource(src,title,`Серія ${episodeInput.value||1}`);attachAniSkip(player.videoRef,malInput.value,episodeInput.value);history.replaceState(null,'',`?src=${encodeURIComponent(src)}&title=${encodeURIComponent(title)}&malId=${encodeURIComponent(malInput.value)}&episode=${encodeURIComponent(episodeInput.value)}`);}document.getElementById('loadBtn').addEventListener('click',loadVideo);if(srcInput.value)loadVideo();
})();</script></body></html>
