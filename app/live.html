<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <title>Аніме Ефір — VakDab</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <style>
    :root { color-scheme:light; --bg:#ffffff; --panel:#ffffff; --panel-2:#f5f5f7; --text:#111114; --muted:#686873; --accent:#d83f63; --line:#e4e4e8; }
    * { box-sizing:border-box; }
    html { background:#ffffff; }
    body { margin:0; min-width:320px; background:#ffffff; color:var(--text); font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button { font:inherit; }
    .app { width:100%; margin:0 auto; padding:0 10px calc(30px + env(safe-area-inset-bottom)); }
    .topbar { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
    .back { display:grid; width:42px; height:42px; flex:none; place-items:center; border:1px solid var(--line); border-radius:50%; color:var(--text); background:rgba(255,255,255,.08); font-size:25px; line-height:1; }
    .kicker { margin:0 0 4px; color:var(--accent); font-size:11px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(25px,7vw,40px); line-height:1; letter-spacing:-.045em; }
    .status { display:flex; align-items:center; gap:7px; margin-left:auto; padding:9px 12px; border-radius:999px; color:#ffd9e2; background:rgba(240,76,112,.18); font-size:12px; font-weight:800; white-space:nowrap; }
    .status i,.live-badge i { display:block; width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px rgba(240,76,112,.18); }
    .stage { position:relative; width:100%; overflow:hidden; aspect-ratio:16/9; border-radius:18px; background:#000; box-shadow:0 14px 40px rgba(0,0,0,.18); }
    video { display:block; width:100%; height:100%; object-fit:contain; background:#000; pointer-events:none; }
    .stage-missing { display:grid; height:100%; min-height:220px; place-items:center; color:var(--muted); font-weight:800; }
    .live-badge { position:absolute; top:13px; left:13px; z-index:2; display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; color:#fff; background:rgba(8,8,10,.82); font-size:12px; font-weight:900; letter-spacing:.12em; }
    .caption { position:absolute; right:0; bottom:0; left:0; z-index:2; padding:72px 17px 16px; background:linear-gradient(transparent,rgba(0,0,0,.9)); pointer-events:none; }
    .caption strong,.caption span { display:block; color:#fff; }
    .caption strong { font-size:clamp(18px,4vw,25px); }
    .caption span { margin-top:4px; color:rgba(255,255,255,.77); font-size:14px; }
    .info { margin-top:14px; padding:18px; border:1px solid var(--line); border-radius:18px; background:var(--panel); }
    .info-head { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; }
    .info h2 { margin:0; font-size:clamp(22px,6vw,32px); letter-spacing:-.04em; }
    .on-air { color:#f7a0b3; font-size:12px; font-weight:800; white-space:nowrap; }
    .meta { margin:10px 0 3px; color:#e1e1e5; font-size:14px; line-height:1.5; }
    .available { color:var(--muted); font-size:12px; }
    .countdown { min-height:20px; margin-top:14px; color:var(--muted); font-size:13px; }
    .countdown strong { color:#ff8099; font-variant-numeric:tabular-nums; }
    .chat { margin-top:14px; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--panel); box-shadow:0 8px 24px rgba(20,20,30,.06); }
    .chat-head { padding:15px 17px; font-weight:800; }
    .chat-head small { display:block; margin-top:3px; color:var(--muted); font-size:11px; font-weight:500; }
    .chat-empty { min-height:72px; padding:18px 17px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }

    .empty,.loading { display:grid; min-height:55vh; place-items:center; text-align:center; color:var(--muted); }
    .empty-card { width:min(100%,420px); padding:28px 20px; border:1px solid var(--line); border-radius:20px; background:var(--panel); box-shadow:0 8px 24px rgba(20,20,30,.06); }
    .empty-card h2 { margin:12px 0 7px; color:var(--text); }
    .empty-card p { margin:0; line-height:1.5; }
    @media (min-width:760px) { .app { padding-left:10px; padding-right:10px; } }
    @media (min-width:700px) and (max-height:600px) { .app { width:100%; padding:12px 30px calc(12px + env(safe-area-inset-bottom)); } .stage { width:min(62vw,1466px); max-width:100%; margin:0; border-radius:0; box-shadow:none; } .chat { display:none; } }
    @media (max-width:699px), (min-width:700px) and (min-height:601px) { .chat { display:block; } }
    @media (max-width:520px) { .app { padding:0 10px calc(30px + env(safe-area-inset-bottom)); } .stage { border-radius:18px; } .caption { padding:52px 13px 13px; } .caption strong { font-size:17px; } .caption span { font-size:12px; } }
    @media (min-width:521px) and (max-width:699px) and (max-height:600px) { .app { padding-left:10px; padding-right:10px; } .stage { border-radius:0; } .chat { display:none; } }
  </style>
</head>
<body>
  <main class="app" id="app"><div class="loading">Підключення до Anime Live…</div></main>
  <script>
    const API = 'https://vakdab.animegran8.workers.dev/api/live';
    const PROXY = 'https://monoanime.animegran8.workers.dev';
    const app = document.getElementById('app');
    let hls = null;
    let currentSource = '';
    let currentTarget = 0;
    const escape = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[char]));
    const isDirect = value => /\.(?:m3u8|mp4)(?:[?#].*)?$/i.test(String(value || '')) || /[?&]url=[^&]*(?:m3u8|mp4)/i.test(String(value || ''));
    const remaining = target => { const seconds = Math.max(0, Math.floor((Number(target || 0) - Date.now()) / 1000)); const hours = Math.floor(seconds / 3600); const minutes = Math.floor((seconds % 3600) / 60); return hours ? `${hours} год ${String(minutes).padStart(2,'0')} хв` : `${minutes}:${String(seconds % 60).padStart(2,'0')}`; };
    const episodes = state => { const start = Number(state.episodeStart || 0); const end = Number(state.episodeEnd || 0); const count = Number(state.episodeCount || 0); if (start && end) return `Серії ${start}–${end}${count ? ` (${count} ${count === 1 ? 'серія' : 'серій'})` : ''}`; if (state.isMovie) return 'Фільм'; return count ? `${count} ${count === 1 ? 'серія' : 'серій'}` : 'Ефір'; };
    async function resolveSource(value) {
      const source = String(value || '').trim();
      if (!source) return '';
      if (isDirect(source)) return source.startsWith(PROXY) ? source : `${PROXY}?url=${encodeURIComponent(source)}&force_ua=mobile`;
      try {
        const response = await fetch(`${PROXY}?url=${encodeURIComponent(source)}&force_ua=mobile`, { cache:'no-store', headers:{ accept:'text/html,application/xhtml+xml' } });
        if (!response.ok) return '';
        const html = await response.text();
        const manifest = (html.match(/https?:\/\/[^"'<>\s]+\.m3u8(?:\?[^"'<>\s]*)?/i) || [])[0] || '';
        return manifest ? `${PROXY}?url=${encodeURIComponent(manifest)}&force_ua=mobile` : '';
      } catch { return ''; }
    }
    function stopVideo() { if (hls) { hls.destroy(); hls = null; } currentSource = ''; }
    function attachVideo(video, source) { stopVideo(); currentSource = source; if (window.Hls?.isSupported?.() && /\.m3u8(?:[?#]|$)/i.test(source)) { hls = new Hls({ enableWorker:true, lowLatencyMode:true }); hls.loadSource(source); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {})); } else { video.src = source; video.play().catch(() => {}); } }
    function renderEmpty(message = 'Ефір зараз не запущено') { stopVideo(); app.innerHTML = `<div class="empty"><section class="empty-card"><div class="kicker">VAKDAB LIVE</div><h2>${escape(message)}</h2><p>Власник VakDab налаштує наступну трансляцію в Telegram.</p></section></div>`; }
    function render(state, source) {
      const previousVideo = document.getElementById('liveVideo');
      const reuseVideo = Boolean(previousVideo && source && currentSource === source);
      if (!source) stopVideo();
      const target = state.status === 'running' ? state.endsAt : state.startsAt;
      currentTarget = Number(target || 0);
      const videoMarkup = source ? `<video id="liveVideo" autoplay muted playsinline preload="auto"></video>` : '<div class="stage-missing">Відео трансляції готується…</div>';
      app.innerHTML = `<div class="stage">${videoMarkup}<div class="live-badge"><i></i> LIVE</div><div class="caption"><strong>${escape(state.animeTitle || 'VakDab')}</strong><span>${escape(episodes(state))} · ${escape(state.dub || 'Озвучка')}</span></div></div><aside class="chat" aria-label="Чат трансляції"><div class="chat-head">Чат трансляції<small>Спільнота VakDab</small></div><div class="chat-empty">Повідомлень поки немає.</div></aside>`;
      const video = document.getElementById('liveVideo');
      if (reuseVideo) video?.replaceWith(previousVideo);
      const activeVideo = document.getElementById('liveVideo');
      if (activeVideo && source && !reuseVideo) attachVideo(activeVideo, source);
    }
    async function load() { try { const response = await fetch(API, { cache:'no-store', headers:{ accept:'application/json' } }); if (!response.ok) throw new Error(); const payload = await response.json(); const state = payload?.live || payload; if (!state || state.status === 'idle') return renderEmpty(); const source = await resolveSource(state.videoUrl); render(state, source); } catch { renderEmpty('Не вдалося завантажити ефір'); } }
    if (window.Telegram?.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); Telegram.WebApp.setHeaderColor?.('#ffffff'); Telegram.WebApp.setBackgroundColor?.('#ffffff'); }
    load();
    setInterval(() => { const node = document.querySelector('#countdown strong'); if (node && currentTarget) node.textContent = remaining(currentTarget); }, 1000);
    setInterval(load, 15000);
  </script>
</body>
</html>
