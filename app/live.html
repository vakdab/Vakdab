<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <title>Аніме Ефір — VakDab</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <style>
    :root { color-scheme:light; --bg:#ffffff; --panel:#ffffff; --panel-2:#f5f5f7; --text:#111114; --muted:#686873; --accent:#d83f63; --line:#e4e4e8; }
    * { box-sizing:border-box; }
    html { background:#ffffff; }
    body { margin:0; min-width:320px; background:#ffffff; color:var(--text); font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button { font:inherit; }
    .app { width:100%; margin:0 auto; padding:0 10px calc(30px + env(safe-area-inset-bottom)); }
    .topbar { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
    .back { display:grid; width:42px; height:42px; flex:none; place-items:center; border:1px solid var(--line); border-radius:50%; color:var(--text); background:rgba(255,255,255,.08); font-size:25px; line-height:1; }
    .kicker { margin:0 0 4px; color:var(--accent); font-size:11px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(25px,7vw,40px); line-height:1; letter-spacing:-.045em; }
    .status { display:flex; align-items:center; gap:7px; margin-left:auto; padding:9px 12px; border-radius:999px; color:#ffd9e2; background:rgba(240,76,112,.18); font-size:12px; font-weight:800; white-space:nowrap; }
    .status i,.live-badge i { display:block; width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px rgba(240,76,112,.18); }
    .stage { position:relative; width:100%; overflow:hidden; aspect-ratio:16/9; border-radius:18px; background:#000; box-shadow:0 14px 40px rgba(0,0,0,.18); }
    video { display:block; width:100%; height:100%; object-fit:contain; background:#000; pointer-events:none; }

    .stage-controls { position:absolute; right:16px; bottom:16px; z-index:4; display:flex; opacity:0; visibility:hidden; transform:translateY(4px); transition:opacity .18s ease,transform .18s ease,visibility .18s ease; }
    .stage.controls-visible .stage-controls,.stage:focus-visible .stage-controls { opacity:1; visibility:visible; transform:none; }
    .chat-head-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .viewer-count { color:var(--muted); font-size:13px; font-weight:700; white-space:nowrap; }
    .stage-control { display:grid; width:44px; height:44px; place-items:center; padding:0; border:1px solid rgba(255,255,255,.28); border-radius:50%; color:#fff; background:rgba(8,8,10,.78); box-shadow:0 4px 14px rgba(0,0,0,.3); cursor:pointer; }
    .stage-control:active { transform:scale(.96); }
    .stage-control svg { width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .stage-control[aria-pressed="true"] { background:#fff; color:#111114; }

    .stage-missing { display:grid; height:100%; min-height:220px; place-items:center; color:var(--muted); font-weight:800; }
    .live-badge { position:absolute; top:16px; left:16px; z-index:2; display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; color:#fff; background:rgba(8,8,10,.82); font-size:12px; font-weight:900; letter-spacing:.12em; opacity:0; visibility:hidden; transform:translateY(-4px); transition:opacity .18s ease,transform .18s ease,visibility .18s ease; }
    .caption { position:absolute; right:0; bottom:0; left:0; z-index:2; padding:72px 17px 16px; background:linear-gradient(transparent,rgba(0,0,0,.9)); pointer-events:none; opacity:0; visibility:hidden; transform:translateY(4px); transition:opacity .18s ease,transform .18s ease,visibility .18s ease; }
    .stage.controls-visible .live-badge,.stage.controls-visible .caption,.stage:focus-visible .live-badge,.stage:focus-visible .caption { opacity:1; visibility:visible; transform:none; }
    .caption strong,.caption span { display:block; color:#fff; }
    .caption strong { font-size:clamp(18px,4vw,25px); }
    .caption span { margin-top:4px; color:rgba(255,255,255,.77); font-size:14px; }
    .info { margin-top:14px; padding:18px; border:1px solid var(--line); border-radius:18px; background:var(--panel); }
    .info-head { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; }
    .info h2 { margin:0; font-size:clamp(22px,6vw,32px); letter-spacing:-.04em; }
    .on-air { color:#f7a0b3; font-size:12px; font-weight:800; white-space:nowrap; }
    .meta { margin:10px 0 3px; color:#e1e1e5; font-size:14px; line-height:1.5; }
    .available { color:var(--muted); font-size:12px; }
    .countdown { min-height:20px; margin-top:14px; color:var(--muted); font-size:13px; }
    .countdown strong { color:#ff8099; font-variant-numeric:tabular-nums; }
    .chat { display:flex; flex-direction:column; min-height:280px; margin-top:14px; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--panel); box-shadow:0 8px 24px rgba(20,20,30,.06); }
    .chat-head { padding:15px 17px; font-weight:800; }
    .chat-head strong { font-size:16px; }
    .chat-head small { display:block; margin-top:3px; color:var(--muted); font-size:11px; font-weight:500; }
    .chat-messages { display:grid; flex:1; align-content:start; gap:10px; min-height:140px; max-height:280px; overflow:auto; padding:14px 17px; border-top:1px solid var(--line); }
    .chat-message { font-size:13px; line-height:1.4; overflow-wrap:anywhere; }
    .chat-message__name { color:var(--accent); font-weight:800; }
    .chat-message__time { margin-left:6px; color:var(--muted); font-size:10px; }
    .chat-message__text { color:var(--text); }
    .chat-empty { color:var(--muted); font-size:13px; }
    .chat-composer { position:sticky; bottom:0; z-index:3; display:flex; align-items:center; gap:8px; padding:10px; border-top:1px solid var(--line); background:var(--panel); scroll-margin-bottom:16px; }
    .chat-composer input { min-width:0; flex:1; height:40px; padding:0 14px; border:1px solid var(--line); border-radius:20px; outline:none; background:var(--panel-2); color:var(--text); }
    .chat-composer input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(216,63,99,.12); }
    .chat-composer button { display:grid; flex:none; width:40px; height:40px; place-items:center; padding:0; border:0; border-radius:50%; color:#fff; background:#111114; cursor:pointer; }
    .chat-composer button svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transform:translateX(-1px); }
    .chat-composer button .sr-only,.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .chat-composer button:disabled { opacity:.55; cursor:wait; }
    .chat-status { min-height:0; padding:0 12px 6px; color:var(--muted); font-size:11px; }
    body.keyboard-open .chat-composer { position:fixed; right:10px; bottom:env(safe-area-inset-bottom); left:10px; z-index:20; border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,.14); }

    .empty,.loading { display:grid; min-height:55vh; place-items:center; text-align:center; color:var(--muted); }
    .empty-card { width:min(100%,420px); padding:28px 20px; border:1px solid var(--line); border-radius:20px; background:var(--panel); box-shadow:0 8px 24px rgba(20,20,30,.06); }
    .empty-card h2 { margin:12px 0 7px; color:var(--text); }
    .empty-card p { margin:0; line-height:1.5; }
    @media (min-width:760px) { .app { padding-left:10px; padding-right:10px; } }
    .live-layout { display:grid; gap:14px; }
    @media (min-width:700px) and (max-height:600px) { .app { width:100%; padding:12px 30px calc(12px + env(safe-area-inset-bottom)); } .live-layout { grid-template-columns:minmax(0,62vw) minmax(0,1fr); gap:16px; align-items:stretch; } .stage { width:100%; max-width:100%; margin:0; border-radius:0; box-shadow:none; } .chat { display:flex; flex-direction:column; height:100%; min-height:0; margin:0; } .chat-messages { flex:1; max-height:none; } body.keyboard-open .chat-composer { position:sticky; right:auto; bottom:auto; left:auto; border:0; border-radius:0; box-shadow:none; } }
    @media (max-width:699px), (min-width:700px) and (min-height:601px) { .app { min-height:100dvh; padding-bottom:env(safe-area-inset-bottom); } .live-layout { display:flex; flex-direction:column; min-height:calc(100dvh - 14px); } .chat { display:flex; flex:1 1 auto; flex-direction:column; height:auto; min-height:0; } .chat-messages { flex:1; min-height:0; max-height:none; } }
    @media (max-width:520px) { .app { min-height:100dvh; padding:0 10px env(safe-area-inset-bottom); } .stage { border-radius:18px; } .caption { padding:52px 13px 13px; } .caption strong { font-size:17px; } .caption span { font-size:12px; } }
    @media (min-width:521px) and (max-width:699px) and (max-height:600px) { .app { padding-left:10px; padding-right:10px; } .stage { border-radius:0; } .chat { display:none; } }
  </style>
</head>
<body>
  <main class="app" id="app"><div class="loading">Підключення до Anime Live…</div></main>
  <script>
    const API = 'https://vakdab.animegran8.workers.dev/api/live';
    const CHAT_API = 'https://vakdab.animegran8.workers.dev/api/live-chat';
    const PROXY = 'https://monoanime.animegran8.workers.dev';
    const app = document.getElementById('app');
    let hls = null;
    let currentSource = '';
    let currentPositionKey = '';
    let currentTarget = 0;
    let currentLiveStart = 0;
    let chatMessages = [];
    let viewerCount = 0;
    const viewerId = (() => { try { const key = 'vakdab-live-viewer-id'; let value = localStorage.getItem(key); if (!value) { value = crypto.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`; localStorage.setItem(key, value); } return value; } catch { return `${Date.now()}-${Math.random().toString(36).slice(2)}`; } })();
    const LIVE_POSITION_KEY = 'vakdab-live-position';
    const escape = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[char]));
    const isDirect = value => /\.(?:m3u8|mp4)(?:[?#].*)?$/i.test(String(value || '')) || /[?&]url=[^&]*(?:m3u8|mp4)/i.test(String(value || ''));
    const remaining = target => { const seconds = Math.max(0, Math.floor((Number(target || 0) - Date.now()) / 1000)); const hours = Math.floor(seconds / 3600); const minutes = Math.floor((seconds % 3600) / 60); return hours ? `${hours} год ${String(minutes).padStart(2,'0')} хв` : `${minutes}:${String(seconds % 60).padStart(2,'0')}`; };
    const episodes = state => { const start = Number(state.episodeStart || 0); const end = Number(state.episodeEnd || 0); const count = Number(state.episodeCount || 0); if (start && end) return `Серії ${start}–${end}${count ? ` (${count} ${count === 1 ? 'серія' : 'серій'})` : ''}`; if (state.isMovie) return 'Фільм'; return count ? `${count} ${count === 1 ? 'серія' : 'серій'}` : 'Ефір'; };
    async function resolveSource(value) {
      const source = String(value || '').trim();
      if (!source) return '';
      if (isDirect(source)) return source.startsWith(PROXY) ? source : `${PROXY}?url=${encodeURIComponent(source)}&force_ua=mobile`;
      try {
        const response = await fetch(`${PROXY}?url=${encodeURIComponent(source)}&force_ua=mobile`, { cache:'no-store', headers:{ accept:'text/html,application/xhtml+xml' } });
        if (!response.ok) return '';
        const html = await response.text();
        const manifest = (html.match(/https?:\/\/[^"'<>\s]+\.m3u8(?:\?[^"'<>\s]*)?/i) || [])[0] || '';
        return manifest ? `${PROXY}?url=${encodeURIComponent(manifest)}&force_ua=mobile` : '';
      } catch { return ''; }
    }
    function saveVideoPosition() { const video = document.getElementById('liveVideo'); if (!video || !(currentPositionKey || currentSource) || !Number.isFinite(video.currentTime) || video.currentTime <= 0) return; try { localStorage.setItem(LIVE_POSITION_KEY, JSON.stringify({ source:currentPositionKey || currentSource, position:video.currentTime, savedAt:Date.now() })); } catch {} }
    function readSavedVideoPosition(sourceKey) { try { const saved = JSON.parse(localStorage.getItem(LIVE_POSITION_KEY) || 'null'); return saved?.source === sourceKey && Number.isFinite(Number(saved.position)) ? { position:Math.max(0, Number(saved.position)), savedAt:Number(saved.savedAt || 0) } : { position:0, savedAt:0 }; } catch { return { position:0, savedAt:0 }; } }
    function resumeVideo(video, source, liveStartedAt, positionKey) { if (!video) return; const saved = readSavedVideoPosition(positionKey); const savedPosition = saved.position + (saved.savedAt > 0 ? Math.max(0, (Date.now() - saved.savedAt) / 1000) : 0); const elapsed = liveStartedAt > 0 ? Math.max(0, (Date.now() - liveStartedAt) / 1000) : 0; let applied = false; const seek = () => { if (applied) return; const duration = Number(video.duration); if (!Number.isFinite(duration) && duration !== Infinity) return; let position = Math.max(savedPosition, elapsed); if (Number.isFinite(duration) && duration > 1) { if (position >= duration - 1 && savedPosition < duration - 1) position = savedPosition; position = Math.min(position, duration - 0.5); } if (position > 0) { try { video.currentTime = position; } catch {} } applied = true; video.removeEventListener('loadedmetadata', seek); video.removeEventListener('durationchange', seek); video.play().catch(() => {}); }; video.addEventListener('loadedmetadata', seek); video.addEventListener('durationchange', seek); seek(); window.setTimeout(seek, 1000); }
    function stopVideo() { saveVideoPosition(); if (hls) { hls.destroy(); hls = null; } currentSource = ''; currentPositionKey = ''; currentLiveStart = 0; }
    function attachVideo(video, source, liveStartedAt, positionKey) { stopVideo(); currentSource = source; currentPositionKey = String(positionKey || source); currentLiveStart = Number(liveStartedAt || 0); if (window.Hls?.isSupported?.() && /\.m3u8(?:[?#]|$)/i.test(source)) { hls = new Hls({ enableWorker:true, lowLatencyMode:true }); hls.loadSource(source); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED, () => resumeVideo(video, source, liveStartedAt, currentPositionKey)); } else { video.src = source; resumeVideo(video, source, liveStartedAt, currentPositionKey); } }
    function renderEmpty(message = 'Ефір зараз не запущено') { stopVideo(); app.innerHTML = `<div class="empty"><section class="empty-card"><div class="kicker">VAKDAB LIVE</div><h2>${escape(message)}</h2><p>Власник VakDab налаштує наступну трансляцію в Telegram.</p></section></div>`; }
    function formatChatTime(value) { return value ? new Date(value).toLocaleTimeString('uk-UA', { hour:'2-digit', minute:'2-digit' }) : ''; }
    function chatMessagesMarkup(messages) { const items = Array.isArray(messages) ? messages : []; return items.length ? items.map(message => `<div class="chat-message"><span class="chat-message__name">${escape(message.name || 'Глядач')}</span><span class="chat-message__time">${escape(formatChatTime(message.createdAt))}</span><div class="chat-message__text">${escape(message.text)}</div></div>`).join('') : '<div class="chat-empty">Повідомлень поки немає.</div>'; }
    async function fetchChat() { try { const url = new URL(CHAT_API); url.searchParams.set('viewer', viewerId); const response = await fetch(url, { cache:'no-store', headers:{ accept:'application/json' } }); if (!response.ok) return []; const payload = await response.json(); viewerCount = Number(payload?.viewerCount || 0); return Array.isArray(payload?.messages) ? payload.messages : []; } catch { return []; } }
    function renderChatMessages(messages) { const target = document.querySelector('.chat-messages'); if (target) target.innerHTML = chatMessagesMarkup(messages); const count = document.querySelector('#liveViewerCount'); if (count) count.textContent = `${viewerCount} ${viewerCount === 1 ? 'глядач' : 'глядачів'}`; }
    function syncKeyboardViewport() {
      const telegram = window.Telegram?.WebApp;
      const viewportHeight = Number(telegram?.viewportHeight || window.visualViewport?.height || window.innerHeight || 0);
      const stableHeight = Number(telegram?.viewportStableHeight || window.innerHeight || viewportHeight);
      const keyboardOpen = viewportHeight > 0 && stableHeight - viewportHeight > 80;
      document.documentElement.style.setProperty('--live-viewport-height', `${viewportHeight}px`);
      document.body.classList.toggle('keyboard-open', keyboardOpen);
      if (keyboardOpen) document.getElementById('liveChatForm')?.scrollIntoView({ block:'nearest', behavior:'smooth' });
    }
    function updateStageControls(stage, video) {
      const mute = stage?.querySelector('#liveMuteToggle');
      if (!mute || !video) return;
      const muted = Boolean(video.muted);
      mute.setAttribute('aria-pressed', String(!muted));
      mute.setAttribute('aria-label', muted ? 'Увімкнути звук' : 'Вимкнути звук');
      mute.innerHTML = muted ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4Z"/><path d="m18 9 3 6M21 9l-3 6"/></svg><span class="sr-only">Увімкнути звук</span>' : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4Z"/><path d="M18 9.5a4.5 4.5 0 0 1 0 5"/></svg><span class="sr-only">Вимкнути звук</span>';
    }
    let stageOverlayTimer = 0;
    function hideStageOverlay(stage) { window.clearTimeout(stageOverlayTimer); stageOverlayTimer = 0; stage?.classList.remove('controls-visible'); }
    function showStageOverlay(stage) { if (!stage) return; window.clearTimeout(stageOverlayTimer); stage.classList.add('controls-visible'); stageOverlayTimer = window.setTimeout(() => hideStageOverlay(stage), 3500); }
    function bindStageControls(stage, video) {
      if (!stage || !video) return;
      stage.addEventListener('click', event => { if (!event.target.closest('button')) showStageOverlay(stage); });
      document.addEventListener('pointerdown', event => { if (!stage.contains(event.target)) hideStageOverlay(stage); }, { passive:true });
      const mute = stage.querySelector('#liveMuteToggle');
      mute?.addEventListener('click', event => { event.stopPropagation(); video.muted = !video.muted; video.defaultMuted = video.muted; showStageOverlay(stage); updateStageControls(stage, video); });
      updateStageControls(stage, video);
    }
    function closeChatKeyboard(input) {
      input?.blur();
      document.body.classList.remove('keyboard-open');
      requestAnimationFrame(syncKeyboardViewport);
    }
    function bindChatComposer() {
      const form = document.getElementById('liveChatForm');
      const input = document.getElementById('liveChatInput');
      const submit = document.getElementById('liveChatSubmit');
      const status = document.getElementById('liveChatStatus');
      if (!form || !input || !submit) return;
      input.addEventListener('focus', () => { requestAnimationFrame(syncKeyboardViewport); setTimeout(syncKeyboardViewport, 180); });
      document.addEventListener('pointerdown', event => {
        if (event.target !== input && !form.contains(event.target)) closeChatKeyboard(input);
      }, { passive:true });
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        submit.disabled = true;
        closeChatKeyboard(input);
        if (status) status.textContent = '';
        try {
          const initData = String(window.Telegram?.WebApp?.initData || '');
          const response = await fetch(CHAT_API, { method:'POST', headers:{ 'content-type':'application/json', 'x-telegram-init-data':initData, 'x-live-viewer-id':viewerId }, body:JSON.stringify({ text, viewer:viewerId, initData }) });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.error || 'SEND_FAILED');
          input.value = '';
          closeChatKeyboard(input);
          chatMessages = await fetchChat();
          renderChatMessages(chatMessages);
        } catch (error) {
          if (status) status.textContent = error.message === 'TELEGRAM_AUTH_REQUIRED' ? 'Відкрий цей чат через Telegram.' : 'Не вдалося надіслати повідомлення.';
        } finally { submit.disabled = false; }
      });
    }
    function render(state, source, messages = chatMessages) {
      const previousVideo = document.getElementById('liveVideo');
      const previousStage = document.querySelector('.stage');
      const reuseVideo = Boolean(previousVideo && source && currentSource === source);
      if (reuseVideo && previousStage) {
        currentTarget = Number(state.status === 'running' ? state.endsAt : state.startsAt || 0);
        const title = previousStage.querySelector('.caption strong');
        const meta = previousStage.querySelector('.caption span');
        if (title) title.textContent = state.animeTitle || 'VakDab';
        if (meta) meta.textContent = `${episodes(state)} · ${state.dub || 'Озвучка'}`;
        renderChatMessages(messages);
        return;
      }
      if (!source) stopVideo();
      const target = state.status === 'running' ? state.endsAt : state.startsAt;
      currentTarget = Number(target || 0);
      const videoMarkup = source ? `<video id="liveVideo" autoplay muted playsinline preload="auto"></video>` : '<div class="stage-missing">Відео трансляції готується…</div>';
      app.innerHTML = `<div class="live-layout"><div class="stage" tabindex="0">${videoMarkup}<div class="stage-controls" aria-label="Керування звуком"><button class="stage-control" id="liveMuteToggle" type="button" aria-pressed="false" aria-label="Увімкнути звук"></button></div><div class="live-badge"><i></i> LIVE</div><div class="caption"><strong>${escape(state.animeTitle || 'VakDab')}</strong><span>${escape(episodes(state))} · ${escape(state.dub || 'Озвучка')}</span></div></div><aside class="chat" aria-label="Чат трансляції"><div class="chat-head"><div class="chat-head-row"><strong>Чат трансляції</strong><span class="viewer-count" id="liveViewerCount">${viewerCount} ${viewerCount === 1 ? 'глядач' : 'глядачів'}</span></div><small>Спільнота VakDab</small></div><div class="chat-messages">${chatMessagesMarkup(messages)}</div><div class="chat-status" id="liveChatStatus" aria-live="polite"></div><form class="chat-composer" id="liveChatForm"><input id="liveChatInput" maxlength="500" autocomplete="off" enterkeyhint="send" placeholder="Написати в чат" aria-label="Повідомлення в чат"><button id="liveChatSubmit" type="submit" aria-label="Надіслати повідомлення"><span class="sr-only">Надіслати</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 21 3l-6.5 18-3.2-7.3L3 11.5Z"/><path d="m11.3 13.7 4.8-4.8"/></svg></button></form></aside></div>`;
      bindChatComposer();
      const video = document.getElementById('liveVideo');
      if (reuseVideo) video?.replaceWith(previousVideo);
      const activeVideo = document.getElementById('liveVideo');
      if (activeVideo && source && !reuseVideo) attachVideo(activeVideo, source, state.startsAt, state.videoUrl);
      if (activeVideo && source) bindStageControls(document.querySelector('.stage'), activeVideo);
    }
    async function load() { try { const response = await fetch(API, { cache:'no-store', headers:{ accept:'application/json' } }); if (!response.ok) throw new Error(); const payload = await response.json(); const state = payload?.live || payload; if (!state || state.status === 'idle') return renderEmpty(); const source = await resolveSource(state.videoUrl); chatMessages = await fetchChat(); render(state, source, chatMessages); } catch { renderEmpty('Не вдалося завантажити ефір'); } }
    if (window.Telegram?.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); Telegram.WebApp.setHeaderColor?.('#ffffff'); Telegram.WebApp.setBackgroundColor?.('#ffffff'); Telegram.WebApp.onEvent?.('viewportChanged', syncKeyboardViewport); }
    window.visualViewport?.addEventListener('resize', syncKeyboardViewport, { passive:true });
    window.addEventListener('resize', syncKeyboardViewport, { passive:true });
    window.addEventListener('pagehide', saveVideoPosition, { passive:true });
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveVideoPosition(); }, { passive:true });
    setInterval(saveVideoPosition, 2000);
    syncKeyboardViewport();
    load();
    setInterval(() => { const node = document.querySelector('#countdown strong'); if (node && currentTarget) node.textContent = remaining(currentTarget); }, 1000);
    setInterval(load, 15000);
  </script>
</body>
</html>
