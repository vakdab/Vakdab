<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <title>Аніме Ефір — VakDab</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <style>
    :root { color-scheme:light; --bg:#ffffff; --panel:#ffffff; --panel-2:#f5f5f7; --text:#111114; --muted:#686873; --accent:#d83f63; --line:#e4e4e8; }
    * { box-sizing:border-box; }
    html { height:100%; overflow:hidden; background:#ffffff; }
    body { height:100%; margin:0; min-width:320px; overflow:hidden; background:#ffffff; color:var(--text); font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button { font:inherit; }
    .app { width:100%; height:var(--live-viewport-height, 100dvh); min-height:0; margin:0 auto; overflow:hidden; padding:0 10px env(safe-area-inset-bottom); }
    .topbar { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
    .back { display:grid; width:42px; height:42px; flex:none; place-items:center; border:1px solid var(--line); border-radius:50%; color:var(--text); background:rgba(255,255,255,.08); font-size:25px; line-height:1; }
    .kicker { margin:0 0 4px; color:var(--accent); font-size:11px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(25px,7vw,40px); line-height:1; letter-spacing:-.045em; }
    .status { display:flex; align-items:center; gap:7px; margin-left:auto; padding:9px 12px; border-radius:999px; color:#ffd9e2; background:rgba(240,76,112,.18); font-size:12px; font-weight:800; white-space:nowrap; }
    .status i,.live-badge i { display:block; width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px rgba(240,76,112,.18); }
    .stage { position:relative; width:100%; overflow:hidden; aspect-ratio:16/9; border-radius:18px; background:#000; box-shadow:0 14px 40px rgba(0,0,0,.18); cursor:pointer; }
    video { display:block; width:100%; height:100%; object-fit:cover; background:#000; pointer-events:none; }

    .chat-head-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .viewer-count { color:var(--muted); font-size:13px; font-weight:700; white-space:nowrap; }

    .stage-missing { display:grid; height:100%; min-height:220px; place-items:center; color:var(--muted); font-weight:800; }
    .live-badge { position:absolute; top:16px; left:16px; z-index:2; display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; color:#fff; background:rgba(8,8,10,.82); font-size:12px; font-weight:900; letter-spacing:.12em; opacity:0; visibility:hidden; transform:translateY(-4px); transition:opacity .18s ease,transform .18s ease,visibility .18s ease; pointer-events:none; }
    .caption { position:absolute; right:0; bottom:14px; left:0; z-index:2; padding:52px 17px 0; background:linear-gradient(transparent,rgba(0,0,0,.9)); pointer-events:none; opacity:0; visibility:hidden; transform:translateY(4px); transition:opacity .18s ease,transform .18s ease,visibility .18s ease; }
    .stage.controls-visible .live-badge,.stage.controls-visible .caption { opacity:1; visibility:visible; transform:none; }
    .caption strong,.caption span { display:block; color:#fff; }
    .caption strong { font-size:clamp(18px,4vw,25px); }
    .caption span { margin-top:4px; color:rgba(255,255,255,.77); font-size:14px; }
    .info { margin-top:14px; padding:18px; border:1px solid var(--line); border-radius:18px; background:var(--panel); }
    .info-head { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; }
    .info h2 { margin:0; font-size:clamp(22px,6vw,32px); letter-spacing:-.04em; }
    .on-air { color:#f7a0b3; font-size:12px; font-weight:800; white-space:nowrap; }
    .meta { margin:10px 0 3px; color:#e1e1e5; font-size:14px; line-height:1.5; }
    .available { color:var(--muted); font-size:12px; }
    .countdown { min-height:20px; margin-top:14px; color:var(--muted); font-size:13px; }
    .countdown strong { color:#ff8099; font-variant-numeric:tabular-nums; }
    .chat { display:flex; flex-direction:column; min-height:0; margin-top:14px; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--panel); box-shadow:0 8px 24px rgba(20,20,30,.06); }
    .chat-head { padding:15px 17px; font-weight:800; }
    .chat-head strong { font-size:16px; }
    .chat-head small { display:block; margin-top:3px; color:var(--muted); font-size:11px; font-weight:500; }
    .chat-messages { display:grid; flex:1 1 0; align-content:start; gap:10px; min-height:0; max-height:none; overflow-y:auto; overscroll-behavior:contain; padding:14px 17px; border-top:1px solid var(--line); }
    .chat-message { font-size:13px; line-height:1.4; overflow-wrap:anywhere; }
    .chat-message__name { color:var(--accent); font-weight:800; }
    .chat-message__time { margin-left:6px; color:var(--muted); font-size:10px; }
    .chat-message__text { color:var(--text); }
    .chat-empty { color:var(--muted); font-size:13px; }
    .chat-composer { position:sticky; bottom:0; z-index:3; display:flex; align-items:center; gap:8px; padding:10px; border-top:1px solid var(--line); background:var(--panel); scroll-margin-bottom:16px; }
    .chat-composer input { min-width:0; flex:1; height:40px; padding:0 14px; border:1px solid var(--line); border-radius:20px; outline:none; background:var(--panel-2); color:var(--text); }
    .chat-composer input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(216,63,99,.12); }
    .chat-composer button { display:grid; flex:none; width:40px; height:40px; place-items:center; padding:0; border:0; border-radius:50%; color:#fff; background:#111114; cursor:pointer; }
    .chat-composer button svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transform:translateX(-1px); }
    .chat-composer button .sr-only,.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .chat-composer button:disabled { opacity:.55; cursor:wait; }
    .chat-status { min-height:0; padding:0 12px 6px; color:var(--muted); font-size:11px; }
    body.keyboard-open .chat-composer { position:fixed; right:10px; bottom:env(safe-area-inset-bottom); left:10px; z-index:20; border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,.14); }

    .empty,.loading { display:grid; min-height:55vh; place-items:center; text-align:center; color:var(--muted); }
    .empty-card { width:min(100%,420px); padding:28px 20px; border:1px solid var(--line); border-radius:20px; background:var(--panel); box-shadow:0 8px 24px rgba(20,20,30,.06); }
    .empty-card h2 { margin:12px 0 7px; color:var(--text); }
    .empty-card p { margin:0; line-height:1.5; }
    @media (min-width:760px) { .app { padding-left:10px; padding-right:10px; } }
    .live-layout { display:grid; height:100%; min-height:0; gap:14px; overflow:hidden; }
    @media (min-width:700px) and (max-height:600px) { .app { width:100%; height:100%; padding:12px 30px calc(12px + env(safe-area-inset-bottom)); } .live-layout { grid-template-columns:minmax(0,1.85fr) minmax(220px,1fr); grid-template-rows:minmax(0,1fr); gap:16px; align-items:stretch; } .stage { width:100%; height:100%; max-width:100%; aspect-ratio:auto; margin:0; border-radius:0; box-shadow:none; } .chat { display:flex; flex-direction:column; height:100%; min-height:0; margin:0; } .chat-messages { flex:1 1 0; min-height:0; max-height:none; } body.keyboard-open .chat-composer { position:sticky; right:auto; bottom:auto; left:auto; border:0; border-radius:0; box-shadow:none; } }
    @media (max-width:699px), (min-width:700px) and (min-height:601px) { .app { padding-bottom:env(safe-area-inset-bottom); } .live-layout { display:flex; flex-direction:column; min-height:0; } .chat { display:flex; flex:1 1 0; flex-direction:column; height:auto; min-height:0; } .chat-messages { flex:1 1 0; min-height:0; max-height:none; } }
    @media (max-width:520px) { .app { min-height:100dvh; padding:0 10px env(safe-area-inset-bottom); } .stage { border-radius:18px; } .caption { bottom:10px; padding:46px 13px 0; } .caption strong { font-size:17px; } .caption span { font-size:12px; } }
    @media (min-width:521px) and (max-width:699px) and (max-height:600px) { .app { padding-left:10px; padding-right:10px; } .stage { border-radius:0; } .chat { display:none; } }
  </style>
</head>
<body>
  <main class="app" id="app"><div class="loading">Підключення до Anime Live…</div></main>
  <script>

    function extractMoonanimeManifest(html) { try { const outer = String(html || '').match(/atob\(\s*["']([A-Za-z0-9+/=]{100,})["']\s*\)/); if (!outer) return ''; const bytes = Uint8Array.from(atob(outer[1]), char => char.charCodeAt(0)); if (bytes.length < 34) return ''; const seed = bytes.slice(1, 33); const decoded = new Uint8Array(bytes.length - 33); let rolling = bytes[0]; for (let index = 0; index < decoded.length; index += 1) { const cipher = bytes[index + 33]; const key = seed[index % 32]; decoded[index] = cipher ^ key ^ rolling; rolling = (cipher + key) & 255; } const loader = new TextDecoder().decode(decoded); const inner = loader.match(/file\s*:\s*\w+\(\s*["']([^"']+)["']\s*\)/); const keyMatch = loader.match(/function\s+\w+\(e\)\s*\{var k=["']([^"']+)["'];var b=atob/); if (!inner || !keyMatch) return ''; const encoded = atob(inner[1]); const key = keyMatch[1]; let file = ''; for (let index = 0; index < encoded.length; index += 1) file += String.fromCharCode(encoded.charCodeAt(index) ^ key.charCodeAt(index % key.length)); const manifest = decodeURIComponent(file); return /^https?:\/\/[^\s]+\.m3u8(?:[?#].*)?$/i.test(manifest) ? manifest : ''; } catch { return ''; } }

    function formatChatTime(value) { return value ? new Date(value).toLocaleTimeString('uk-UA', { hour:'2-digit', minute:'2-digit' }) : ''; }

    function render(state, source, playlist = [], messages = chatMessages) {
      const previousVideo = document.getElementById('liveVideo');
      const previousStage = document.querySelector('.stage');
      const playlistKey = playlist.length ? `${playlist.map(item => item.episode).join('|')}|${Number(state.startsAt || 0)}` : (source ? `single|${Number(state.startsAt || 0)}` : '');
      const playbackUnhealthy = Boolean(previousVideo && (previousVideo.error || (previousVideo.readyState === 0 && previousVideo.networkState === 3)));
      const reuseVideo = Boolean(previousVideo && playlist.length && currentPositionKey === playlistKey && !playbackUnhealthy);
      if (reuseVideo && previousStage) {
        currentTarget = Number(state.status === 'running' ? state.endsAt : state.startsAt || 0);
        const title = previousStage.querySelector('.caption strong');
        const meta = previousStage.querySelector('.caption span');
        if (title) title.textContent = state.animeTitle || 'VakDab';
        if (meta) meta.textContent = `${episodes(state)} · ${state.dub || 'Озвучка'}`;
        currentEpisodeSources = playlist;
        const refreshed = playlist[currentEpisodeIndex]?.url;
        if (refreshed && refreshed !== currentSource && sourceExpiresSoon(currentSource)) loadEpisode(previousVideo, refreshed, currentLiveStart, currentPositionKey, currentEpisodeOffset, currentEpisodeIndex);
        renderChatMessages(messages);
        return;
      }
      if (!source) stopVideo();
      const target = state.status === 'running' ? state.endsAt : state.startsAt;
      currentTarget = Number(target || 0);
      const videoMarkup = source ? `<video id="liveVideo" autoplay playsinline preload="auto"></video>` : '<div class="stage-missing">Відео трансляції готується…</div>';
      app.innerHTML = `<div class="live-layout"><div class="stage">${videoMarkup}<div class="live-badge"><i></i> LIVE</div><div class="caption"><strong>${escape(state.animeTitle || 'VakDab')}</strong><span>${escape(episodes(state))} · ${escape(state.dub || 'Озвучка')}</span></div></div><aside class="chat" aria-label="Чат трансляції"><div class="chat-head"><div class="chat-head-row"><strong>Чат трансляції</strong><span class="viewer-count" id="liveViewerCount">${viewerCount} ${viewerCount === 1 ? 'глядач' : 'глядачів'}</span></div><small>Спільнота VakDab</small></div><div class="chat-messages">${chatMessagesMarkup(messages)}</div><div class="chat-status" id="liveChatStatus" aria-live="polite"></div><form class="chat-composer" id="liveChatForm"><input id="liveChatInput" maxlength="500" autocomplete="off" enterkeyhint="send" placeholder="Написати в чат" aria-label="Повідомлення в чат"><button id="liveChatSubmit" type="submit" aria-label="Надіслати повідомлення"><span class="sr-only">Надіслати</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 21 3l-6.5 18-3.2-7.3L3 11.5Z"/><path d="m11.3 13.7 4.8-4.8"/></svg></button></form></aside></div>`;
      bindChatComposer();
      scrollChatToBottom();
      const video = document.getElementById('liveVideo');
      if (reuseVideo) video?.replaceWith(previousVideo);
      const activeVideo = document.getElementById('liveVideo');
      if (activeVideo && source && !reuseVideo) attachVideo(activeVideo, playlist.length ? playlist : [{ episode: 1, url: source }], state.startsAt, playlistKey);
      if (activeVideo && source) { syncVideoToLiveClock(activeVideo); bindStageOverlay(document.querySelector('.stage'), activeVideo); }
    }
    async function load() { try { const response = await fetch(`${API}?fresh=${Date.now()}`, { cache:'no-store', headers:{ accept:'application/json' } }); if (!response.ok) throw new Error(); const payload = await response.json(); syncServerClock(payload?.serverNow || payload?.live?.serverNow); const state = payload?.live || payload; if (!state || state.status !== 'running') return renderEmpty(state?.status === 'finished' ? 'Ефір завершено' : undefined); const rawSources = Array.isArray(state.episodeSources) && state.episodeSources.length ? state.episodeSources : [{ episode: Number(state.episodeStart || 1), url: state.videoUrl }]; const playlist = (await Promise.all(rawSources.map(async item => ({ episode: item.episode, url: await resolveSource(item.url) })))).filter(item => item.url); const source = playlist[0]?.url || ''; chatMessages = await fetchChat(); render(state, source, playlist, chatMessages); } catch { renderEmpty('Не вдалося завантажити ефір'); } }
    if (window.Telegram?.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); Telegram.WebApp.setHeaderColor?.('#ffffff'); Telegram.WebApp.setBackgroundColor?.('#ffffff'); Telegram.WebApp.onEvent?.('viewportChanged', syncKeyboardViewport); }
    window.visualViewport?.addEventListener('resize', syncKeyboardViewport, { passive:true });
    window.addEventListener('resize', syncKeyboardViewport, { passive:true });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) syncVideoToLiveClock(); }, { passive:true });
    syncKeyboardViewport();
    load();
    setInterval(() => { const node = document.querySelector('#countdown strong'); if (node && currentTarget) node.textContent = remaining(currentTarget); }, 1000);
    setInterval(load, 30000);
  </script>
